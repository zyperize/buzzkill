name: Buzzkill
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.buzzkill.app
    CODE_SIGN_ENTITLEMENTS: Buzzkill/Buzzkill.entitlements
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.0
    DEVELOPMENT_TEAM: 4T7KSYZ4F9
targets:
  Buzzkill:
    type: application
    platform: iOS
    info:
      path: Buzzkill/Info.plist
      properties:
        CFBundleDisplayName: Buzzkill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.buzzkill.app
            CFBundleURLSchemes:
              - buzzkill
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - path: Buzzkill
    resources:
      - path: Buzzkill/Resources
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Buzzkill
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
